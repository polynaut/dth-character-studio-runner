name: parser-tests

# The plugin itself cannot build in CI — both Daz SDKs are store downloads.
# The pure CSV job-file parser has no Qt/SDK dependency, so it builds and
# runs everywhere; that is what this workflow verifies.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (parser tests only — no DAZ_SDK_DIR)
        # No -G: use the runner image's default Visual Studio generator,
        # whatever VS version the image ships.
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
